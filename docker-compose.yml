services:
  postgres:
    image: postgres:17-alpine
    container_name: autoshop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: autoshop
      POSTGRES_PASSWORD: autoshop
      POSTGRES_DB: autoshop
    ports:
      - "5432:5432"
    volumes:
      - autoshop-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoshop -d autoshop"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  autoshop-pgdata:
